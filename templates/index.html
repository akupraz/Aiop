<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOP RDFE - Chart Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1.1em; opacity: 0.9; }
        .main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .main { grid-template-columns: 1fr; } }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .card h2 { font-size: 1.5em; margin-bottom: 20px; color: #1e3c72; border-bottom: 3px solid #2a5298; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; font-family: inherit; transition: border-color 0.3s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1); }
        textarea { resize: vertical; min-height: 100px; font-family: 'Courier New', monospace; }
        button { background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%); color: white; padding: 14px 30px; border: none; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; width: 100%; }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(42, 82, 152, 0.3); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #2a5298; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result { display: none; }
        .result.show { display: block; }
        .result-box { background: #f8f9fa; border-left: 5px solid #2a5298; padding: 20px; border-radius: 8px; margin-bottom: 15px; max-height: 600px; overflow-y: auto; }
        .result-box h3 { color: #1e3c72; margin-bottom: 10px; font-size: 1.1em; }
        .result-content { font-family: 'Courier New', monospace; font-size: 0.9em; line-height: 1.6; color: #333; white-space: pre-wrap; word-wrap: break-word; }
        .error { background: #fee; border-left: 5px solid #f44; padding: 15px; border-radius: 8px; color: #c33; display: none; margin-bottom: 20px; }
        .error.show { display: block; }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .summary-item { background: #f0f4ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2a5298; }
        .summary-item label { font-size: 0.85em; color: #666; margin-bottom: 5px; }
        .summary-item .value { font-size: 1.3em; font-weight: 700; color: #1e3c72; }
        .footer { text-align: center; color: rgba(255,255,255,0.8); font-size: 0.9em; margin-top: 30px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-weight: 600; color: #999; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; width: auto; font-size: 1em; }
        .tab-btn.active { color: #2a5298; border-bottom-color: #2a5298; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 AIOP RDFE Analyzer</h1>
            <p>Analisis chart saham dengan AI + Bandarmologi</p>
        </header>
        
        <div class="main">
            <div class="card">
                <h2>📝 Input Data</h2>
                <form id="analyzeForm">
                    <div class="tabs">
                        <button type="button" class="tab-btn active" data-tab="basic">Dasar</button>
                        <button type="button" class="tab-btn" data-tab="chart">Chart</button>
                        <button type="button" class="tab-btn" data-tab="bandarmologi">Bandarmologi</button>
                    </div>
                    
                    <div class="tab-content active" id="basic">
                        <div class="form-group">
                            <label for="saham_code">Kode Saham *</label>
                            <input type="text" id="saham_code" name="saham_code" placeholder="Contoh: BMRI" required>
                        </div>
                        <div class="form-group">
                            <label for="current_price">Harga Saat Ini (Rp) *</label>
                            <input type="number" id="current_price" name="current_price" placeholder="4080" required>
                        </div>
                        <div class="form-group">
                            <label for="timeframe">Timeframe *</label>
                            <select id="timeframe" name="timeframe" required>
                                <option value="daily">Daily</option>
                                <option value="4h">4 Jam</option>
                                <option value="1h">1 Jam</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="tab-content" id="chart">
                        <div class="form-group">
                            <label>Deskripsi Chart *</label>
                            <textarea id="chart_description" name="chart_description" placeholder="Downtrend, MA 5 di bawah MA 8..." required></textarea>
                        </div>
                    </div>
                    
                    <div class="tab-content" id="bandarmologi">
                        <div class="form-group">
                            <label>Data Bandarmologi</label>
                            <textarea id="bandarmologi_data" name="bandarmologi_data" placeholder="Foreign Sell: 49.5M..."></textarea>
                        </div>
                    </div>
                    
                    <button type="submit" id="submitBtn">🚀 Analisis Sekarang</button>
                </form>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Analisis sedang berjalan...</p>
                </div>
                
                <div class="error" id="error"></div>
            </div>
            
            <div class="card">
                <h2>📈 Hasil Analisis</h2>
                
                <div class="summary" id="summary" style="display: none;">
                    <div class="summary-item">
                        <label>Rekomendasi</label>
                        <div class="value" id="summaryRec">-</div>
                    </div>
                    <div class="summary-item">
                        <label>Confidence</label>
                        <div class="value" id="summaryConf">-</div>
                    </div>
                    <div class="summary-item">
                        <label>Risk/Reward</label>
                        <div class="value" id="summaryRR">-</div>
                    </div>
                    <div class="summary-item">
                        <label>Tipe Trading</label>
                        <div class="value" id="summaryType">-</div>
                    </div>
                </div>
                
                <div class="result" id="result">
                    <div class="result-box">
                        <h3>📊 JSON Output</h3>
                        <div class="result-content" id="resultContent"></div>
                    </div>
                    <button type="button" id="copyBtn" style="background: #28a745;">📋 Copy JSON</button>
                    <button type="button" id="downloadBtn" style="background: #007bff; margin-top: 5px;">💾 Download</button>
                </div>
                
                <div id="emptyState" style="text-align: center; padding: 40px; color: #999;">
                    <p>📝 Isi form dan klik "Analisis Sekarang"</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });
        
        document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const sahamCode = document.getElementById('saham_code').value;
            const currentPrice = document.getElementById('current_price').value;
            const timeframe = document.getElementById('timeframe').value;
            const chartDesc = document.getElementById('chart_description').value;
            const bandarmData = document.getElementById('bandarmologi_data').value;
            
            if (!sahamCode || !currentPrice || !chartDesc) {
                showError('Isi semua field yang required (*)');
                return;
            }
            
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        saham_code: sahamCode,
                        current_price: currentPrice,
                        timeframe: timeframe,
                        chart_description: chartDesc,
                        bandarmologi_data: bandarmData
                    })
                });
                
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Gagal');
                
                displayResult(data.data);
                displaySummary(data.data);
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('result').classList.add('show');
                document.getElementById('summary').style.display = 'grid';
                
            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
            }
        });
        
        function displayResult(data) {
            const content = JSON.stringify(data, null, 2);
            document.getElementById('resultContent').textContent = content;
            window.resultData = data;
        }
        
        function displaySummary(data) {
            document.getElementById('summaryRec').textContent = data.trading_plan?.recommendation || '-';
            document.getElementById('summaryConf').textContent = (data.confidence || 0) + '%';
            document.getElementById('summaryRR').textContent = data.trading_plan?.risk_reward || '-';
            document.getElementById('summaryType').textContent = data.trading_plan?.type || '-';
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('submitBtn').disabled = show;
        }
        
        function showError(msg) {
            document.getElementById('error').textContent = msg;
            document.getElementById('error').classList.add('show');
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }
        
        document.getElementById('copyBtn').addEventListener('click', () => {
            const content = document.getElementById('resultContent').textContent;
            navigator.clipboard.writeText(content).then(() => alert('✅ Copied!'));
        });
        
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const data = window.resultData;
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `analisis_${data.code}_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
